[package]
authors = ["Roelof J.C. Kluin"]
description = "ollama/chroma command-line AI chat tool"
edition = "2024"
license = "MIT"
name = "ruchat"
repository = "https://github.com/RoelKluin/ruchat"
version = "0.1.2"

[dependencies]
anyhow = "^1.0.104"
async-trait = "^0.1.91"
chroma = "0.13.3"
chroma-types = "0.13.3"
chrono = "0.4.45"
clap = { version = "^4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
crossterm = "^0.29.0"
diffy = "0.5.1"
fs2 = "^0.4.3"
futures-util = "0.3.33"
http = "^1.5.0"
indicatif = "0.18.6"
log = "^0.4.33"
md-5 = "^0.10.6"
ollama-rs = { version = "^0.3.6", features = ["stream", "headers", "tool-implementations", "macros", "modelfile"] }
regex = "1.13.1"
reqwest = "^0.13.4"
schemars = "^1.2.2"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
thiserror = "^2.0.19"
tiktoken-rs = "0.12.0"
tokio = "^1.53.1"
tokio-stream = "^0.1.19"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "^1.24.0"

[dev-dependencies]
tempfile = "3.27.0"
